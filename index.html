<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#E2461F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Sparkora Fire Challenge: how fast can you make your Sparkora?">
<title>Sparkora Fire Challenge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   SPARKORA FIRE CHALLENGE — styles
   Brand tokens live here. The game uses one fixed brand look
   in both light and dark system themes.
   ========================================================= */
:root{
  --spk-orange:#F26B2C;   /* logo orange */
  --ember:#E2461F;
  --flame:#FFC53D;
  --flame-2:#FF8A1F;
  --char:#7A1C0B;
  --coal:#2B0F07;
  --toast:#FFF3E3;
  --toast-2:#FFE2BF;
  --boost:#FFE94A;
  --ink:#2B0F07;
  --muted:#8A5A45;
  --display:'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --toast:#FFF3E3; } }
:root[data-theme="dark"]{ --toast:#FFF3E3; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--ink);
  background:#C9361A;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- world background: hot, bright, not "dark gamer" ---------- */
#world{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(120% 70% at 50% 62%, #FFB347 0%, rgba(255,138,31,.0) 60%),
    linear-gradient(180deg,#FF8A3D 0%,#F0572A 38%,#C9361A 72%,#8E1E0C 100%);
  transition:filter .3s;
}
#world::after{ /* slow heat waves */
  content:"";position:absolute;inset:-20%;
  background:repeating-radial-gradient(circle at 50% 120%, rgba(255,255,255,.05) 0 18px, rgba(255,255,255,0) 18px 46px);
  animation:heatwave 9s linear infinite;opacity:.8;
}
@keyframes heatwave{to{transform:translateY(-46px)}}
body.ev-fireup #world{filter:saturate(1.35) brightness(1.08)}
body.ev-boost #world{filter:hue-rotate(-12deg) saturate(1.4) brightness(1.12)}

#app{position:fixed;inset:0;z-index:1;max-width:560px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top,0px)) 18px max(16px,env(safe-area-inset-bottom,0px))}
.screen.on{display:flex}

/* ---------- shared components ---------- */
.btn{
  display:flex;align-items:center;justify-content:center;gap:.4em;width:100%;max-width:360px;
  min-height:64px;padding:0 24px;border-radius:22px;
  font-family:var(--display);font-size:clamp(22px,6.4vw,28px);letter-spacing:.02em;color:var(--coal);
  background:linear-gradient(180deg,#FFE58A 0%,var(--flame) 38%,var(--flame-2) 100%);
  box-shadow:0 6px 0 #B8420F,0 12px 26px rgba(90,20,5,.35),inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #B8420F,0 6px 14px rgba(90,20,5,.3),inset 0 2px 0 rgba(255,255,255,.7)}
.btn.ghost{background:rgba(255,243,227,.16);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,243,227,.6);min-height:54px;font-size:20px}
.btn.ghost:active{transform:translateY(2px)}
.btn.dark{background:linear-gradient(180deg,#5A1A0A,#3A0F05);color:var(--toast);box-shadow:0 5px 0 #1E0602,0 10px 20px rgba(0,0,0,.3)}
.btn[disabled]{opacity:.5;pointer-events:none}
.stack{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.arming .btn{pointer-events:none}
.icon-btn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;
  background:rgba(43,15,7,.28);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{background:var(--toast);border-radius:28px;box-shadow:0 18px 40px rgba(70,15,4,.35);color:var(--ink)}
.display{font-family:var(--display);font-weight:400;letter-spacing:.01em}

/* ---------- loading ---------- */
#scr-loading{justify-content:center;gap:22px;background:linear-gradient(180deg,#FF8A3D,#E2461F)}
#scr-loading img{width:min(62vw,280px);animation:breathe 1.2s ease-in-out infinite}
.loadbar{width:160px;height:8px;border-radius:8px;background:rgba(43,15,7,.25);overflow:hidden}
.loadbar i{display:block;height:100%;width:40%;border-radius:8px;background:var(--flame);animation:load 1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@keyframes breathe{50%{transform:scale(1.04);filter:drop-shadow(0 0 16px rgba(255,220,120,.8))}}

/* ---------- start / attract ---------- */
#scr-start{justify-content:flex-start}
.start-foot{margin-top:auto}
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:48px}
.brandlogo{width:min(54vw,230px);filter:drop-shadow(0 3px 0 rgba(122,28,11,.35))}
.hero-title{text-align:center;margin-top:1vh}
.hero-title .kicker{font-size:clamp(26px,8vw,40px);line-height:1;color:#fff;display:block;
  text-shadow:0 4px 0 var(--char),0 0 28px rgba(255,210,90,.55)}
.hero-title .big{display:block;font-size:clamp(44px,14vw,74px);line-height:.92;
  background:linear-gradient(180deg,#FFF6C2 0%,var(--flame) 45%,#FF7A1A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 var(--char)) drop-shadow(0 0 22px rgba(255,190,60,.6));
  animation:titleflick 2.4s ease-in-out infinite}
@keyframes titleflick{50%{filter:drop-shadow(0 5px 0 var(--char)) drop-shadow(0 0 34px rgba(255,200,70,.9))}}
.tagline{margin:8px auto 0;font-weight:600;color:#FFF3E3;font-size:clamp(16px,4.6vw,19px);text-align:center;max-width:22em}
.mascot-start{position:absolute;right:-6px;bottom:calc(max(16px,env(safe-area-inset-bottom,0px)) + 150px);width:min(30vw,150px);pointer-events:none;
  transform-origin:50% 100%;animation:wave 2.6s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(80,15,5,.35))}
@keyframes wave{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg) translateY(-6px)}}
.rules{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.rules span{white-space:nowrap;font-family:var(--display);font-size:14px;color:#fff;background:rgba(122,28,11,.35);padding:6px 9px;border-radius:12px}
.start-foot{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px}
#btnStart{min-height:78px;font-size:clamp(26px,7.6vw,32px);animation:ctapulse 1.6s ease-in-out infinite}
@keyframes ctapulse{50%{transform:scale(1.035)}}
.linkrow{display:flex;gap:10px;width:100%;max-width:360px}
.linkrow .btn{flex:1}

/* ---------- countdown ---------- */
#scr-count{justify-content:center;pointer-events:none}
#countNum{font-family:var(--display);color:#fff;font-size:clamp(120px,42vw,210px);line-height:1;
  text-shadow:0 8px 0 var(--char),0 0 50px rgba(255,210,90,.9)}
#countNum.word{font-size:clamp(56px,17vw,92px);background:linear-gradient(180deg,#FFF6C2,var(--flame) 50%,#FF7A1A);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 var(--char));text-shadow:none}

/* ---------- gameplay ---------- */
#scr-game{padding:0;touch-action:none;cursor:pointer}
.hud{position:relative;z-index:3;width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;
  padding:max(12px,env(safe-area-inset-top,0px)) 14px 0}
.hud-box{background:rgba(43,15,7,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:18px;padding:6px 14px 8px;color:#fff;min-width:108px}
.hud-box .lbl{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85}
.hud-box b{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,40px);line-height:1;font-variant-numeric:tabular-nums}
.hud-score{text-align:right;justify-self:end}
#hudTime.low b{color:#FFE94A;animation:lowtime .5s ease-in-out infinite}
@keyframes lowtime{50%{transform:scale(1.08)}}
.hud-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.progress{position:relative;z-index:3;width:calc(100% - 28px);margin:12px 14px 0}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;color:#fff;margin-bottom:6px}
#stageLabel{font-family:var(--display);font-size:clamp(20px,6vw,26px);text-shadow:0 2px 0 var(--char)}
#pct{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--char)}
.bar{position:relative;height:18px;border-radius:12px;background:rgba(43,15,7,.4);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.3)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:left;transform:scaleX(0);border-radius:12px;
  background:linear-gradient(90deg,#F7A4B0 0%,#F28A4A 35%,#E8561E 60%,#FFC53D 100%);background-size:calc(100vw - 28px) 100%;
  transition:transform .09s linear}
.bar em{position:absolute;top:3px;bottom:3px;width:2px;background:rgba(255,243,227,.45);border-radius:2px}
.combo{position:absolute;z-index:4;left:50%;top:31%;transform:translateX(-50%);font-family:var(--display);color:#fff;
  font-size:clamp(28px,8.6vw,40px);text-shadow:0 4px 0 var(--char),0 0 20px rgba(255,200,70,.9);opacity:0;transition:opacity .2s;white-space:nowrap;pointer-events:none}
.combo.on{opacity:1}
.chip{position:absolute;z-index:4;left:50%;top:calc(var(--hudH,150px) + 2px);transform:translateX(-50%);display:none;align-items:center;gap:8px;
  padding:6px 14px 8px;border-radius:14px;font-family:var(--display);font-size:20px;color:var(--coal);background:var(--boost);
  box-shadow:0 4px 0 rgba(122,28,11,.45);overflow:hidden;white-space:nowrap}
.chip.on{display:flex}
.chip.fire{background:linear-gradient(90deg,#FFE58A,#FF8A1F)}
.chip i{position:absolute;left:0;bottom:0;height:4px;width:100%;background:rgba(43,15,7,.55);transform-origin:left}
.banner{position:absolute;z-index:6;left:0;right:0;top:40%;transform:translateY(-50%);text-align:center;pointer-events:none;opacity:0}
.banner .t{display:block;font-family:var(--display);font-size:clamp(40px,12.5vw,62px);line-height:1;color:#fff;
  text-shadow:0 5px 0 var(--char),0 0 36px rgba(255,210,90,.95)}
.banner .s{display:inline-block;margin-top:8px;font-family:var(--display);font-size:clamp(20px,6vw,26px);color:var(--coal);
  background:var(--flame);padding:4px 14px 6px;border-radius:12px;box-shadow:0 4px 0 var(--char)}
.banner.boost .t{color:#FFF9C4;text-shadow:0 5px 0 #6B2A00,0 0 30px #FFE94A,0 0 60px #FFE94A}
.banner.smoke .t{color:#fff;text-shadow:0 5px 0 #4A4A4A,0 0 20px rgba(255,255,255,.8)}
.banner.show{animation:bannerIn 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bannerIn{0%{opacity:0;transform:translateY(-50%) scale(.4)}14%{opacity:1;transform:translateY(-50%) scale(1.08)}24%{transform:translateY(-50%) scale(1)}
  80%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-70%) scale(.9)}}
.banner.hold{animation:bannerHold .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes bannerHold{0%{opacity:0;transform:translateY(-50%) scale(.4)}60%{opacity:1;transform:translateY(-50%) scale(1.1)}100%{opacity:1;transform:translateY(-50%) scale(1)}}
#smoke{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .45s;overflow:hidden}
#smoke.on{opacity:1}
#smoke b{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(245,240,236,.92) 0%,rgba(225,218,212,.75) 45%,rgba(220,210,205,0) 70%);
  animation:drift 3.2s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-18px,8px) scale(1)}to{transform:translate(22px,-10px) scale(1.12)}}
body.ev-boost .hud-box{box-shadow:0 0 0 2px var(--boost),0 0 22px rgba(255,233,74,.8)}
body.ev-boost #scr-game::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 0 4px var(--boost),inset 0 0 60px rgba(255,233,74,.65);animation:zap .35s steps(2) infinite}
@keyframes zap{50%{box-shadow:inset 0 0 0 6px #fff,inset 0 0 90px rgba(255,233,74,.85)}}
body.ev-fireup #scr-game::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 70px rgba(255,120,20,.85);animation:zap .5s ease-in-out infinite}
.tapzone{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 16px max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}
.tapbtn{width:100%;max-width:420px;height:clamp(92px,17vh,130px);border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--display);font-size:clamp(30px,9vw,40px);color:var(--coal);
  background:radial-gradient(120% 140% at 50% 0%,#FFF1A8 0%,var(--flame) 40%,#FF7A1A 100%);
  box-shadow:0 8px 0 #B8420F,0 18px 30px rgba(90,20,5,.4),inset 0 3px 0 rgba(255,255,255,.7);transition:transform .05s}
.tapbtn small{font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:.08em;opacity:.7}
.tapbtn.hit{transform:translateY(5px) scale(.985);box-shadow:0 3px 0 #B8420F,0 8px 16px rgba(90,20,5,.35),inset 0 3px 0 rgba(255,255,255,.7)}
.pop{position:absolute;z-index:7;left:0;top:0;font-family:var(--display);font-size:26px;color:#fff;pointer-events:none;
  text-shadow:0 3px 0 var(--char);white-space:nowrap;will-change:transform,opacity;opacity:0}
.pop.x2{color:#FFF6A0;font-size:30px}

/* ---------- results ---------- */
.panel-screen{justify-content:flex-start;overflow-y:auto}
.panel-screen::before,.panel-screen::after{content:"";flex:1 1 0}
.panel-screen > .card{flex-shrink:0}
.result{position:relative;width:100%;max-width:420px;padding:58px 20px 20px;margin:110px 0 12px;text-align:center}
.result .mascot{position:absolute;left:50%;top:-118px;height:168px;width:auto;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(80,15,5,.3))}
.result .mascot.cheer{animation:cheer .9s ease-in-out infinite}
@keyframes cheer{50%{transform:translateX(-50%) translateY(-10px) rotate(3deg)}}
.result .mascot.sad{animation:shiver .18s linear infinite}
@keyframes shiver{50%{transform:translateX(calc(-50% + 2px))}}
.result h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,40px);line-height:1;color:var(--ember)}
.result .sub{margin:6px 0 14px;font-family:var(--display);font-size:clamp(18px,5.4vw,22px);color:var(--coal)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.stats div{background:var(--toast-2);border-radius:16px;padding:8px 4px}
.stats span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:clamp(22px,6.8vw,30px);color:var(--coal);font-variant-numeric:tabular-nums}
.breakdown{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px;color:var(--muted);text-align:left;margin:0 6px 14px}
.breakdown b{color:var(--coal);text-align:right;font-variant-numeric:tabular-nums}
.tier{position:relative;margin:4px 0 16px;padding:14px 12px 16px;border-radius:22px;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,#FF9A3D,#E2461F 60%,#9E2410)}
.tier .flames{font-size:26px;line-height:1}
.tier .name{display:block;font-family:var(--display);font-size:clamp(28px,8.6vw,36px);line-height:1.05;text-shadow:0 3px 0 rgba(90,15,5,.5)}
.tier .reward{display:inline-block;margin-top:8px;padding:5px 12px;border-radius:10px;background:rgba(255,243,227,.95);color:var(--coal);font-weight:800;font-size:15px}
.tier.t0{background:linear-gradient(160deg,#B48A76,#7A4A38)}
.tier.t2{box-shadow:0 0 0 3px #FFE58A,0 0 26px rgba(255,197,61,.8)}
.tier.t3{background:linear-gradient(160deg,#FFD24A,#FF7A1A 45%,#C9261A);box-shadow:0 0 0 3px #FFF3A8,0 0 40px rgba(255,210,70,1);animation:legend 1.4s ease-in-out infinite}
.tier.t3 .name{font-size:clamp(32px,10vw,42px)}
@keyframes legend{50%{box-shadow:0 0 0 4px #fff,0 0 60px rgba(255,210,70,1)}}
.tier::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.note{font-size:14px;color:var(--muted);margin:0 0 14px}
.minibar{height:14px;border-radius:10px;background:var(--toast-2);overflow:hidden;margin:0 0 14px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,#F7A4B0,#E8561E);border-radius:10px}

/* ---------- name ---------- */
.namecard{width:100%;max-width:400px;padding:26px 20px 20px;text-align:center}
.namecard h2,.boardcard h2,.codecard h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(28px,8.4vw,36px);color:var(--ember);line-height:1.05}
.namecard p{margin:0 0 16px;color:var(--muted);font-size:15px}
#nameInput{width:100%;height:68px;border-radius:18px;border:3px solid var(--toast-2);background:#fff;text-align:center;
  font-family:var(--display);font-size:30px;letter-spacing:.06em;color:var(--coal);text-transform:uppercase;margin-bottom:6px;-webkit-user-select:text;user-select:text}
#nameInput:focus{outline:none;border-color:var(--flame-2)}
.count{font-size:13px;color:var(--muted);margin-bottom:14px;text-align:right}
.textlink{font-weight:800;color:var(--muted);padding:12px;font-size:15px}

/* ---------- leaderboard ---------- */
.boardcard{width:100%;max-width:440px;padding:22px 14px 16px;text-align:center;display:flex;flex-direction:column;max-height:100%}
.tabs{display:flex;gap:6px;background:var(--toast-2);border-radius:14px;padding:4px;margin:6px 0 10px}
.tabs button{flex:1;height:40px;border-radius:11px;font-weight:800;font-size:13px;white-space:nowrap;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--coal);box-shadow:0 2px 6px rgba(90,20,5,.15)}
.lb{width:100%;border-collapse:separate;border-spacing:0 4px;font-variant-numeric:tabular-nums}
.lb th{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding:0 6px;text-align:left}
.lb th:nth-child(3),.lb th:nth-child(4),.lb td:nth-child(3),.lb td:nth-child(4){text-align:right}
.lb td{padding:8px 6px;background:#fff;font-weight:600;font-size:15px}
.lb td:first-child{border-radius:12px 0 0 12px;font-family:var(--display);font-size:18px;width:40px;text-align:center}
.lb td:last-child{border-radius:0 12px 12px 0;color:var(--muted)}
.lb td:nth-child(3){font-family:var(--display);font-size:18px;font-weight:400}
.lb tr.r1 td{background:#FFE58A}.lb tr.r2 td{background:#FFF0C8}.lb tr.r3 td{background:#FFE7D2}
.lb tr.me td{background:var(--ember);color:#fff}
.lb tr.me td:last-child{color:#FFE2BF}
.lb .nm{max-width:9.5em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.boardscroll{overflow-y:auto;min-height:0;flex:1;margin-bottom:12px}
.empty{padding:26px 10px;color:var(--muted);font-weight:600}
.yours{margin:0 0 12px;padding:8px 12px;border-radius:14px;background:var(--ember);color:#fff;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-weight:800;text-align:left}
.yours small{display:block;font-size:10px;letter-spacing:.08em;opacity:.8}
.yours .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.yours b{font-family:var(--display);font-weight:400;font-size:22px}

/* ---------- reward code ---------- */
.codecard{position:relative;width:100%;max-width:400px;padding:24px 20px 20px;text-align:center;overflow:hidden}
.codebox{position:relative;margin:12px 0;padding:18px 10px;border-radius:22px;background:var(--coal);color:#fff;
  box-shadow:0 0 0 4px var(--flame),0 0 0 8px var(--ember),0 0 30px rgba(255,160,40,.7);animation:codeglow 1.6s ease-in-out infinite}
@keyframes codeglow{50%{box-shadow:0 0 0 4px #FFE58A,0 0 0 8px var(--flame-2),0 0 44px rgba(255,190,60,.95)}}
.codebox .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--toast-2)}
#codeText{display:block;font-family:var(--display);font-size:clamp(40px,13vw,56px);letter-spacing:.06em;line-height:1.1;color:var(--flame)}
.codemeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px;text-align:left}
.codemeta div{background:var(--toast-2);border-radius:14px;padding:8px 12px}
.codemeta span{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.codemeta b{font-size:15px}
#liveClock{font-family:var(--display);font-size:24px;color:var(--coal);font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ember)}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ember);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.staff{font-family:var(--display);font-size:20px;color:var(--coal);margin:6px 0 14px}

/* ---------- admin ---------- */
#scr-admin{background:#FFF3E3;overflow-y:auto;display:none;align-items:stretch;padding:16px;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
#scr-admin.on{display:block}
#scr-admin h2{font-family:var(--display);font-weight:400;color:var(--ember);margin:4px 0 4px;font-size:28px}
#scr-admin h3{margin:18px 0 8px;font-size:16px;color:var(--char)}
.adm-grid{display:grid;grid-template-columns:1fr 110px;gap:6px 10px;align-items:center;font-size:14px}
.adm-grid input[type=number],.adm-grid input[type=text],.rw input{height:38px;border-radius:10px;border:2px solid var(--toast-2);padding:0 8px;font:inherit;width:100%;background:#fff}
.adm-row{display:flex;flex-wrap:wrap;gap:8px}
.abtn{padding:10px 14px;border-radius:12px;background:var(--coal);color:#fff;font-weight:800;font-size:14px}
.abtn.warn{background:#B3261E}.abtn.alt{background:#fff;color:var(--coal);box-shadow:inset 0 0 0 2px var(--coal)}
.rw{display:grid;grid-template-columns:80px 1fr 1fr 34px;gap:6px;margin-bottom:6px}
.adm-list{font-size:13px;max-height:220px;overflow:auto;background:#fff;border-radius:12px;padding:6px}
.adm-list div{display:flex;justify-content:space-between;gap:8px;padding:5px 4px;border-bottom:1px solid #f1e3d4}
.adm-list button{color:#B3261E;font-weight:800}
.pinwrap{max-width:320px;margin:20vh auto 0;text-align:center}
.pinwrap input{width:100%;height:56px;border-radius:14px;border:3px solid var(--toast-2);font:inherit;font-size:28px;text-align:center;letter-spacing:.3em;margin:12px 0}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--coal);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}


@media (orientation:landscape) and (max-height:520px){
  .mascot-start{display:none}
  .hero-title .big{font-size:52px}.hero-title .kicker{font-size:30px}
  .tapbtn{height:78px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important}
}
</style>
</head>

/* =========================================================================
   2. STORAGE (safe wrapper — private mode / blocked storage never crashes)
   ========================================================================= */
const Store = {
  get(k, fb){ try{ const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); }catch(e){ return fb; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
  clearAll(){ try{ Object.keys(localStorage).filter(k => k.startsWith('spk.')).forEach(k => localStorage.removeItem(k)); }catch(e){} }
};
const KEYS = { board:'spk.leaderboard', codes:'spk.codes', config:'spk.config', muted:'spk.muted', device:'spk.device' };

let CFG = loadConfig();
function loadConfig(){
  const shared = window.SPARKORA_CONFIG || {};
  const o = Object.assign({}, shared, Store.get(KEYS.config, {}));  // defaults < config.js < this device's admin overrides
  const c = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  for (const k in o){ if (k in c) c[k] = (k === 'EVENT_WEIGHTS') ? Object.assign(c[k], o[k]) : o[k]; }
  c.rewards = (c.rewards || []).slice().sort((a,b) => a.minScore - b.minScore);
  return c;
}

/* =========================================================================
   3. LEADERBOARD SERVICE
   Gameplay only talks to `Leaderboard`. When config.js has SHEET_API_URL
   (Google Apps Script Web App), scores go to Google Sheets and every phone
   + the big-screen display share one board. Otherwise each phone keeps its own.
   ========================================================================= */
const OUTLET = (new URLSearchParams(location.search).get('outlet') || '').slice(0, 40) || null;
const SHEET_API = (() => { const u = ((window.SPARKORA_CONFIG || {}).SHEET_API_URL || '').trim(); return /^https:\/\/script\.google(usercontent)?\.com\//.test(u) || /^https?:\/\/localhost/.test(u) ? u : null; })();
// GET for reads, POST with a plain-text body for writes (no CORS preflight → works with Apps Script).
async function sheetApi(params, body){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  try {
    const r = body
      ? await fetch(SHEET_API, { method: 'POST', body: JSON.stringify(body), redirect: 'follow', signal: ctl.signal })
      : await fetch(SHEET_API + '?' + new URLSearchParams(params), { redirect: 'follow', cache: 'no-store', signal: ctl.signal });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Sheet API error'); return j;
  } finally { clearTimeout(t); }
}

const LocalBoard = {
  online: false,
  list(scope){ const all = Store.get(KEYS.board, []).filter(e => !OUTLET || e.outlet === OUTLET).sort(rankSort); return scope === 'today' ? all.filter(e => e.day === todayKey()) : all; },
  async board(scope, n, entry){ const l = this.list(scope); const i = entry ? l.findIndex(e => e.id === entry.id) : -1; return { top: l.slice(0, n), rank: i < 0 ? -1 : i + 1 }; },
  async add(entry){ const list = Store.get(KEYS.board, []); list.push(entry); list.sort(rankSort); Store.set(KEYS.board, list.slice(0, 500)); return entry; },
  async all(){ return Store.get(KEYS.board, []).slice().sort(rankSort); },
  async remove(id){ Store.set(KEYS.board, Store.get(KEYS.board, []).filter(e => e.id !== id)); },
  async reset(){ Store.del(KEYS.board); }
};
const SheetBoard = {
  online: true,
  norm(j){ return { top: (j.top || []).map(e => Object.assign(e, { time: e.time === '' || e.time == null ? null : +e.time })), rank: j.rank || -1 }; },
  async board(scope, n, entry){
    const p = { action: 'board', scope, limit: n }; if (OUTLET) p.outlet = OUTLET; if (entry) p.id = entry.id;
    return this.norm(await sheetApi(p));
  },
  // one round trip: saves the score AND returns today's board with the player's rank
  async add(entry, n = 10){
    return this.norm(await sheetApi(null, { action: 'add', id: entry.id, name: entry.name, score: entry.score, time: entry.time, taps: entry.taps, outlet: entry.outlet || OUTLET || '', limit: n }));
  },
  async all(){ return (await this.board('all', 50)).top; },
  async remove(){ throw new Error('Hide rows in the Google Sheet'); },
  async reset(){ throw new Error('Clear rows in the Google Sheet'); }
};
const Leaderboard = SHEET_API ? SheetBoard : LocalBoard;
// Scores that couldn't be sent (bad signal) are retried on the next submit / page load.
const Pending = {
  get: () => Store.get('spk.pending', []),
  push(e){ const l = this.get(); if (!l.some(x => x.id === e.id)) l.push(e); Store.set('spk.pending', l.slice(-20)); },
  async flush(){ if (!SHEET_API) return; for (const e of this.get()){ try { await SheetBoard.add(e); Store.set('spk.pending', this.get().filter(x => x.id !== e.id)); } catch (err) { return; } } }
};
const warmUp = () => { if (SHEET_API) sheetApi({ action: 'ping' }).catch(() => {}); };  // wakes Apps Script before it's needed
function rankSort(a, b){ return (b.score - a.score) || ((a.time ?? 1e9) - (b.time ?? 1e9)) || (a.ts - b.ts); }
function todayKey(d = new Date()){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

/* =========================================================================
   4. REWARD SERVICE
   Codes are generated locally for the prototype. For production, replace
   claim() with a POST to your backend that issues + stores the code and
   enforces limits server-side (see README).
   ========================================================================= */
const Rewards = {
  tierFor(score, perfect){
    if (CFG.REWARDS_REQUIRE_PERFECT_GRILL && !perfect) return null;
    let t = null, idx = 0;
    CFG.rewards.forEach((r, i) => { if (score >= r.minScore){ t = r; idx = i + 1; } });
    return t ? Object.assign({ level: idx, of: CFG.rewards.length }, t) : null;
  },
  todaysClaim(){
    const d = todayKey();
    return Store.get(KEYS.codes, []).find(c => c.day === d && c.device === deviceId()) || null;
  },
  async claim(result, tier, name){
    const lim = CFG.REWARD_LIMIT_PER_DEVICE_PER_DAY;
    if (lim > 0){
      const d = todayKey();
      const mine = Store.get(KEYS.codes, []).filter(c => c.day === d && c.device === deviceId());
      if (mine.length >= lim) return Object.assign({ repeat: true }, mine[mine.length - 1]);
    }
    const codes = Store.get(KEYS.codes, []);
    let code;
    do { code = CFG.REWARD_CODE_PREFIX + '-' + randCode(4); } while (codes.some(c => c.code === code));
    const rec = { code, tier: tier.title, reward: tier.reward, score: result.score, name, ts: Date.now(), day: todayKey(), device: deviceId() };
    codes.push(rec); Store.set(KEYS.codes, codes.slice(-2000));
    if (SHEET_API) sheetApi(null, Object.assign({ action: 'reward', outlet: OUTLET || '' }, rec)).catch(() => {}); // log for staff to verify
    return rec;
  }
};
function randCode(n){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const b = new Uint8Array(n);
  (window.crypto || window.msCrypto).getRandomValues(b);
  return Array.from(b, x => A[x % A.length]).join('');
}
function deviceId(){ let id = Store.get(KEYS.device, null); if (!id){ id = 'D' + randCode(8); Store.set(KEYS.device, id); } return id; }

/* =========================================================================
   5. SOUND — synthesised with Web Audio (no files, zero load time)
   ========================================================================= */
const Sfx = (() => {
  let ac = null, master = null, noiseBuf = null, amb = null, ambGain = null;
  let muted = Store.get(KEYS.muted, false);
  function init(){
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const on = () => ac && !muted;
  function noise(dur, type, f0, f1, vol, q = 1, when = 0){
    if (!on()) return; const t = ac.currentTime + when;
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.playbackRate.value = 0.8 + Math.random() * 0.4;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function tone(freq, dur, type = 'square', vol = 0.15, when = 0, slideTo){
    if (!on()) return; const t = ac.currentTime + when;
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  return {
    init,
    get muted(){ return muted; },
    toggle(){ muted = !muted; Store.set(KEYS.muted, muted); if (master) master.gain.value = muted ? 0 : 0.8; return muted; },
    ignite(){ noise(0.7, 'lowpass', 300, 4000, 0.5, 0.7); tone(90, 0.35, 'sine', 0.35, 0, 45); },
    beep(){ tone(660, 0.14, 'square', 0.12); },
    go(){ tone(990, 0.3, 'square', 0.14); noise(0.8, 'lowpass', 500, 5000, 0.45, 0.7); },
    sizzle(){ noise(0.12 + Math.random() * 0.06, 'highpass', 2500 + Math.random() * 1500, 6000, 0.13, 0.6); },
    stage(){ tone(880, 0.1, 'triangle', 0.14); tone(1320, 0.14, 'triangle', 0.12, 0.07); },
    combo(){ tone(700 + Math.random() * 100, 0.08, 'triangle', 0.08, 0, 1100); },
    fireBurst(){ noise(0.9, 'lowpass', 250, 3500, 0.6, 0.8); tone(110, 0.4, 'sawtooth', 0.12, 0, 60); },
    perfectEvent(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.18, 'triangle', 0.15, i * 0.06)); noise(0.4, 'highpass', 3000, 7000, 0.18); },
    smoke(){ noise(1.1, 'bandpass', 1400, 250, 0.35, 0.8); },
    boost(){ tone(260, 0.5, 'sawtooth', 0.1, 0, 1400); tone(520, 0.5, 'square', 0.05, 0.05, 2400); },
    timesUp(){ [523, 415, 330].forEach((f, i) => tone(f, 0.22, 'square', 0.13, i * 0.17)); },
    win(){ noise(1.2, 'highpass', 2000, 7000, 0.3); [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, 'triangle', 0.16, 0.05 + i * 0.08)); tone(1568, 0.6, 'triangle', 0.14, 0.5); },
    ambient(level){ // continuous grill crackle while cooking
      if (!ac) return;
      if (!amb){ amb = ac.createBufferSource(); amb.buffer = noiseBuf; amb.loop = true;
        const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3200;
        ambGain = ac.createGain(); ambGain.gain.value = 0; amb.connect(f); f.connect(ambGain); ambGain.connect(master); amb.start(); }
      ambGain.gain.setTargetAtTime(muted ? 0 : level, ac.currentTime, 0.15);
    }
  };
})();
const buzz = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* =========================================================================
   6. RENDERER — one canvas: coals, flames, grill, steak, sparks, smoke
   The steak is drawn procedurally so it can cook continuously (0 → 1).
   ========================================================================= */
const FX = (() => {
  const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1;
  const S = { p: 0.55, pDraw: 0.55, heat: 0.6, pulse: 0, squash: 0, shake: 0, fire: 1, boost: 0, smokeExtra: 0,
              cy: 0.6, size: 0.78, tcy: 0.6, tsize: 0.78, dim: 0, tdim: 0, t: 0, flash: 0 };
  const flames = [], sparks = [], smokes = [];
  const MAX = { flames: reduce ? 20 : 70, sparks: reduce ? 30 : 140, smokes: reduce ? 12 : 46 };

  // ---- pre-rendered sprites (cheap drawImage instead of per-frame gradients)
  function sprite(size, stops){
    const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
    const gr = g.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
  }
  const SPR = {
    flame: sprite(64, [[0,'rgba(255,248,200,1)'],[.25,'rgba(255,200,80,.9)'],[.55,'rgba(255,110,20,.55)'],[1,'rgba(220,40,10,0)']]),
    spark: sprite(24, [[0,'rgba(255,255,230,1)'],[.3,'rgba(255,210,90,.9)'],[1,'rgba(255,120,20,0)']]),
    smoke: sprite(128,[[0,'rgba(240,232,226,.55)'],[.5,'rgba(225,215,208,.28)'],[1,'rgba(220,210,205,0)']])
  };

  // ---- steak geometry (unit space) + marbling, generated once
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const shape = []; for (let i = 0; i < 48; i++){ const a = i / 48 * Math.PI * 2;
    const r = 1 + 0.07 * Math.sin(3 * a + 1.2) + 0.05 * Math.sin(5 * a + 0.3) - 0.06 * Math.max(0, Math.cos(a - 2.6)) ** 3;
    shape.push([Math.cos(a) * r, Math.sin(a) * r * 0.78]); }
  const marble = []; for (let i = 0; i < 14; i++){ const x = (rnd() - .5) * 1.3, y = (rnd() - .5) * 0.9;
    const pts = [[x, y]]; let a = rnd() * 6.28; for (let j = 0; j < 4; j++){ a += (rnd() - .5) * 1.4; const l = 0.08 + rnd() * 0.1; pts.push([pts[j][0] + Math.cos(a) * l, pts[j][1] + Math.sin(a) * l * 0.8]); }
    marble.push({ pts, w: 0.012 + rnd() * 0.022 }); }
  const coals = []; for (let i = 0; i < 26; i++) coals.push({ x: rnd(), y: rnd(), r: 0.05 + rnd() * 0.07, ph: rnd() * 6.28 });
  const specks = []; for (let i = 0; i < 9; i++) specks.push({ x: (rnd() - .5) * 1.1, y: (rnd() - .6) * 0.7, r: 0.012 + rnd() * 0.02, ph: rnd() * 6.28 });
  function steakPath(c, rx, ry){ c.beginPath(); shape.forEach(([x, y], i) => {
      const nx = shape[(i + 1) % shape.length], mx = (x + nx[0]) / 2 * rx, my = (y + nx[1]) / 2 * ry;
      if (i === 0) c.moveTo(mx, my); else c.quadraticCurveTo(x * rx, y * ry, mx, my); });
    const [x0, y0] = shape[0], n0 = shape[1]; c.quadraticCurveTo(x0 * rx, y0 * ry, (x0 + n0[0]) / 2 * rx, (y0 + n0[1]) / 2 * ry); c.closePath(); }

  // ---- colour helpers
  const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const ramp = (stops, p) => { for (let i = 1; i < stops.length; i++){ if (p <= stops[i][0]){ const [p0, c0] = stops[i-1], [p1, c1] = stops[i]; const t = (p - p0) / (p1 - p0);
      return c0.map((v, k) => Math.round(v + (c1[k] - v) * t)); } } return stops[stops.length - 1][1]; };
  const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const CENTER = [[0,hex('#F0808E')],[.25,hex('#D9665E')],[.5,hex('#B85B38')],[.75,hex('#A5552C')],[1,hex('#9C5429')]];
  const EDGE   = [[0,hex('#D95C70')],[.25,hex('#B5473F')],[.5,hex('#83361E')],[.75,hex('#5E2511')],[1,hex('#4E1D0B')]];
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };

  function resize(){
    const r = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  window.addEventListener('resize', resize);

  function geom(){
    const base = Math.min(W, H * 0.72, 520);
    const gw = base * S.size * 0.94, gh = gw * 0.66;
    return { cx: W / 2, cy: H * S.cy, gw, gh, rx: gw * 0.34, ry: gh * 0.42 };
  }

  // ---- spawners
  function spawnFlame(g, big){
    if (flames.length >= MAX.flames) return;
    const x = g.cx + (Math.random() - .5) * g.gw * 0.86, y = g.cy + g.gh * (0.08 + Math.random() * 0.3);
    flames.push({ x, y, vx: (Math.random() - .5) * 20, vy: -(60 + Math.random() * 90) * (big ? 1.7 : 1), life: 0, max: 0.5 + Math.random() * 0.45, s: g.gw * (0.07 + Math.random() * 0.08) * (big ? 1.4 : 1) });
  }
  function spawnSpark(x, y, n, power = 1){
    for (let i = 0; i < n && sparks.length < MAX.sparks; i++){
      const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = (140 + Math.random() * 260) * power;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: 0.35 + Math.random() * 0.5, s: 5 + Math.random() * 7 });
    }
  }
  function spawnSmoke(x, y, n, power = 1){
    for (let i = 0; i < n && smokes.length < MAX.smokes; i++)
      smokes.push({ x: x + (Math.random() - .5) * 60, y, vx: (Math.random() - .5) * 18, vy: -(28 + Math.random() * 40) * power, life: 0, max: 1.4 + Math.random() * 1.2, s: 40 + Math.random() * 50, rot: Math.random() * 6 });
  }

  // ---- main draw
  let last = performance.now(), running = true;
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now; S.t += dt;
    if (running) draw(dt);
    requestAnimationFrame(frame);
  }
  function draw(dt){
    const k = 1 - Math.pow(0.001, dt);
    S.cy += (S.tcy - S.cy) * k * 0.9; S.size += (S.tsize - S.size) * k * 0.9; S.dim += (S.tdim - S.dim) * k;
    S.pDraw += (S.p - S.pDraw) * Math.min(1, dt * 14);
    S.pulse *= Math.pow(0.02, dt); S.squash *= Math.pow(0.0005, dt); S.shake *= Math.pow(0.0008, dt); S.flash *= Math.pow(0.05, dt);
    const g = geom(), p = S.pDraw;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    if (S.shake > 0.2 && !reduce) ctx.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake);

    const heat = clamp(S.heat + S.pulse * 0.4 + (S.fire - 1) * 0.25, 0, 1.4);
    // glow under grill
    const gl = ctx.createRadialGradient(g.cx, g.cy, g.gw * 0.1, g.cx, g.cy, g.gw * 0.95);
    gl.addColorStop(0, `rgba(255,190,80,${0.35 + 0.35 * heat})`); gl.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);

    // grill body (iron tray)
    const x0 = g.cx - g.gw / 2, y0 = g.cy - g.gh / 2;
    ctx.fillStyle = '#3A1A10'; roundRect(x0 - 10, y0 - 10, g.gw + 20, g.gh + 20, 26); ctx.fill();
    ctx.fillStyle = '#1E0B06'; roundRect(x0, y0, g.gw, g.gh, 18); ctx.fill();
    // coals
    ctx.save(); roundRect(x0, y0, g.gw, g.gh, 18); ctx.clip();
    coals.forEach(c => { const f = 0.55 + 0.45 * Math.sin(S.t * 3 + c.ph);
      const cx = x0 + c.x * g.gw, cy = y0 + c.y * g.gh, r = c.r * g.gw;
      ctx.globalAlpha = clamp(0.35 + 0.5 * heat * f); ctx.drawImage(SPR.flame, cx - r * 1.6, cy - r * 1.6, r * 3.2, r * 3.2); });
    ctx.globalAlpha = 1; ctx.restore();

    // flames (behind grate)
    const rate = (0.35 + heat * 0.9) * S.fire * (reduce ? 0.3 : 1);
    for (let i = 0; i < rate * 60 * dt * 2; i++) spawnFlame(g, S.fire > 1.3);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = flames.length - 1; i >= 0; i--){ const f = flames[i]; f.life += dt; if (f.life > f.max){ flames.splice(i, 1); continue; }
      f.x += f.vx * dt; f.y += f.vy * dt; const t = f.life / f.max, s = f.s * (1 - t * 0.6);
      ctx.globalAlpha = (1 - t) * 0.9; ctx.drawImage(SPR.flame, f.x - s / 2, f.y - s, s, s * 1.5); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    // grate bars glow with heat
    const bars = 9, hot = ramp([[0, hex('#4A3028')], [0.6, hex('#B8551E')], [1, hex('#FF9A3A')]], clamp(heat * 0.85));
    ctx.lineCap = 'round';
    for (let i = 0; i < bars; i++){ const y = y0 + g.gh * (0.08 + i * 0.84 / (bars - 1));
      ctx.strokeStyle = '#140604'; ctx.lineWidth = g.gh * 0.05; line(x0 + 6, y + 2, x0 + g.gw - 6, y + 2);
      ctx.strokeStyle = rgb(hot); ctx.lineWidth = g.gh * 0.038; line(x0 + 6, y, x0 + g.gw - 6, y);
      ctx.strokeStyle = 'rgba(255,230,190,.25)'; ctx.lineWidth = g.gh * 0.01; line(x0 + 10, y - g.gh * 0.01, x0 + g.gw - 10, y - g.gh * 0.01); }

    // steak
    const shrink = 1 - 0.07 * p, sx = (1 + S.squash * 0.07) * shrink, sy = (1 - S.squash * 0.09) * shrink;
    ctx.save(); ctx.translate(g.cx, g.cy); ctx.scale(sx, sy);
    ctx.fillStyle = 'rgba(20,5,2,.45)'; ctx.beginPath(); ctx.ellipse(g.rx * 0.04, g.ry * 0.14, g.rx * 1.05, g.ry * 0.95, 0, 0, 6.283); ctx.fill();
    steakPath(ctx, g.rx, g.ry);
    const cc = ramp(CENTER, p), ec = ramp(EDGE, p);
    const sg = ctx.createRadialGradient(-g.rx * 0.2, -g.ry * 0.25, g.rx * 0.1, 0, 0, g.rx * 1.1);
    sg.addColorStop(0, rgb(cc)); sg.addColorStop(0.7, rgb(ramp(CENTER, clamp(p + 0.12)))); sg.addColorStop(1, rgb(ec));
    ctx.fillStyle = sg; ctx.fill();
    ctx.save(); steakPath(ctx, g.rx, g.ry); ctx.clip();
    // marbling: white fat → golden rendered fat
    const fatW = 1 - smooth(0.2, 0.85, p), fatG = smooth(0.35, 1, p);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    marble.forEach(m => { ctx.beginPath(); m.pts.forEach(([x, y], i) => i ? ctx.lineTo(x * g.rx, y * g.ry) : ctx.moveTo(x * g.rx, y * g.ry));
      ctx.lineWidth = m.w * g.rx * 1.6;
      if (fatW > 0.02){ ctx.strokeStyle = `rgba(255,236,236,${0.6 * fatW})`; ctx.stroke(); }
      if (fatG > 0.02){ ctx.strokeStyle = `rgba(232,168,90,${0.4 * fatG})`; ctx.stroke(); } });
    // caramel crust tone
    if (p > 0.45){ ctx.fillStyle = `rgba(150,70,25,${0.25 * smooth(0.45, 1, p)})`; ctx.fillRect(-g.rx * 1.2, -g.ry * 1.2, g.rx * 2.4, g.ry * 2.4); }
    // grill marks
    const mA = smooth(0.12, 0.85, p) * 0.85, sp = g.rx * 0.36;
    if (mA > 0.01){ ctx.save(); ctx.rotate(-0.55);
      for (let i = -4; i <= 4; i++){ const x = i * sp;
        ctx.fillStyle = `rgba(60,20,6,${mA * 0.45})`; ctx.fillRect(x - sp * 0.2, -g.rx * 1.4, sp * 0.4, g.rx * 2.8);
        ctx.fillStyle = `rgba(28,8,2,${mA})`; ctx.fillRect(x - sp * 0.1, -g.rx * 1.4, sp * 0.2, g.rx * 2.8); }
      ctx.restore(); }
    const xA = smooth(0.55, 1, p) * 0.6;
    if (xA > 0.01){ ctx.save(); ctx.rotate(0.62);
      for (let i = -4; i <= 4; i++){ const x = i * sp; ctx.fillStyle = `rgba(35,10,3,${xA})`; ctx.fillRect(x - sp * 0.08, -g.rx * 1.4, sp * 0.16, g.rx * 2.8); }
      ctx.restore(); }
    // charred rim
    steakPath(ctx, g.rx, g.ry);
    ctx.strokeStyle = `rgba(45,14,4,${0.12 + 0.5 * p})`; ctx.lineWidth = g.rx * 0.3; ctx.stroke();
    ctx.strokeStyle = `rgba(30,8,2,${0.1 + 0.55 * p})`; ctx.lineWidth = g.rx * 0.1; ctx.stroke();
    // juicy shine
    const sh = smooth(0.82, 1, p);
    if (sh > 0.01){
      const shimmer = 0.75 + 0.25 * Math.sin(S.t * 4);
      const hg = ctx.createRadialGradient(-g.rx * 0.35, -g.ry * 0.4, 0, -g.rx * 0.35, -g.ry * 0.4, g.rx * 0.75);
      hg.addColorStop(0, `rgba(255,240,215,${0.45 * sh * shimmer})`); hg.addColorStop(1, 'rgba(255,240,215,0)');
      ctx.fillStyle = hg; ctx.fillRect(-g.rx * 1.2, -g.ry * 1.2, g.rx * 2.4, g.ry * 2.4);
      specks.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${sh * (0.5 + 0.5 * Math.sin(S.t * 5 + s.ph))})`;
        ctx.beginPath(); ctx.arc(s.x * g.rx, s.y * g.ry, s.r * g.rx, 0, 6.283); ctx.fill(); });
    }
    if (S.flash > 0.02){ ctx.fillStyle = `rgba(255,230,160,${S.flash * 0.5})`; ctx.fillRect(-g.rx * 1.2, -g.ry * 1.2, g.rx * 2.4, g.ry * 2.4); }
    ctx.restore();
    // raw outline
    steakPath(ctx, g.rx, g.ry); ctx.strokeStyle = `rgba(255,255,255,${0.18 * (1 - p)})`; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();

    // steam/smoke rising from steak
    const steam = (0.03 + p * 0.5 + S.smokeExtra) * (reduce ? 0.3 : 1);
    if (Math.random() < steam * dt * 12) spawnSmoke(g.cx + (Math.random() - .5) * g.rx, g.cy - g.ry * 0.2, 1, 0.8 + p);
    for (let i = smokes.length - 1; i >= 0; i--){ const s = smokes[i]; s.life += dt; if (s.life > s.max){ smokes.splice(i, 1); continue; }
      s.x += s.vx * dt; s.y += s.vy * dt; s.vx += Math.sin(S.t * 2 + s.rot) * 6 * dt; const t = s.life / s.max, sz = s.s * (0.6 + t * 1.3);
      ctx.globalAlpha = Math.sin(t * Math.PI) * 0.75; ctx.drawImage(SPR.smoke, s.x - sz / 2, s.y - sz / 2, sz, sz); }
    ctx.globalAlpha = 1;

    // sparks
    ctx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--){ const s = sparks[i]; s.life += dt; if (s.life > s.max){ sparks.splice(i, 1); continue; }
      s.vy += 380 * dt; s.x += s.vx * dt; s.y += s.vy * dt; const t = 1 - s.life / s.max;
      ctx.globalAlpha = t; ctx.drawImage(SPR.spark, s.x - s.s / 2, s.y - s.s / 2, s.s, s.s); }
    if (S.boost > 0){ // electric glints around the grill
      ctx.globalAlpha = 0.6 + Math.random() * 0.4; ctx.strokeStyle = '#FFF59A'; ctx.lineWidth = 3; ctx.beginPath();
      for (let j = 0; j < 2; j++){ let x = g.cx + (Math.random() - .5) * g.gw, y = g.cy - g.gh * 0.7; ctx.moveTo(x, y);
        for (let q = 0; q < 5; q++){ x += (Math.random() - .5) * 40; y += g.gh * 0.1; ctx.lineTo(x, y); } }
      ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

    if (S.dim > 0.01){ ctx.fillStyle = `rgba(122,28,11,${S.dim * 0.35})`; ctx.fillRect(0, 0, W, H); }
  }
  function roundRect(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function line(a, b, c, d){ ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke(); }

  resize(); requestAnimationFrame(frame);
  return {
    S,
    layout(mode){ const L = { attract: [0.6, 0.78, 0], game: [0.54, 0.96, 0], panel: [0.6, 0.85, 1] }[mode]; S.tcy = L[0]; S.tsize = L[1]; S.tdim = L[2]; },
    tap(){ const g = geom(); S.pulse = 1; S.squash = 1; S.shake = Math.min(6, S.shake + 3);
      spawnSpark(g.cx + (Math.random() - .5) * g.rx, g.cy - g.ry * 0.3, 3 + (S.fire > 1.3 ? 3 : 0));
      if (Math.random() < 0.45) spawnSmoke(g.cx + (Math.random() - .5) * g.rx, g.cy - g.ry * 0.3, 1, 1.2);
      spawnFlame(g, true); },
    burst(power = 1){ const g = geom(); S.flash = 1; S.shake = 10 * power; spawnSpark(g.cx, g.cy - g.ry * 0.2, Math.round(40 * power), 1.3); spawnSmoke(g.cx, g.cy - g.ry * 0.2, Math.round(6 * power), 1.4);
      for (let i = 0; i < 14 * power; i++) spawnFlame(g, true); },
    steakPoint(){ const g = geom(); return { x: g.cx, y: g.cy - g.ry * 0.6 }; },
    resize,
    pause(v){ running = !v; }
  };
})();

/* =========================================================================
   7. GAME ENGINE — state, input, scoring, events. No DOM screens here
   except the in-game HUD it owns.
   ========================================================================= */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const STAGES = [[0, 'RAW'], [0.25, 'HEATING'], [0.5, 'GRILLING'], [0.75, 'ALMOST PERFECT'], [1, 'PERFECT GRILL']];
const EVENTS = {
  fireUp:  { dur: () => CFG.FIRE_UP_DURATION, title: '🔥 FIRE UP!', sub: () => 'GO FASTER! ' + CFG.FIRE_UP_MULTIPLIER + 'x POINTS', chip: () => '🔥 FIRE UP ' + CFG.FIRE_UP_MULTIPLIER + 'x', cls: 'fire' },
  boost:   { dur: () => CFG.BOOST_DURATION,   title: '⚡ SPARKORA BOOST!', sub: () => '⚡ x' + CFG.BOOST_MULTIPLIER + ' SCORE!', chip: () => '⚡ x' + CFG.BOOST_MULTIPLIER + ' SCORE!', cls: 'boost' },
  smoke:   { dur: () => CFG.SMOKE_DURATION,   title: '💨 SMOKE ATTACK!', sub: () => 'KEEP TAPPING!', chip: () => '💨 SMOKE ATTACK', cls: 'smoke' },
  perfect: { dur: () => 0, title: '🥩 PERFECT GRILL!', sub: () => '+' + CFG.PERFECT_EVENT_BONUS + ' BONUS', cls: '' }
};

const G = { state: 'idle' };
function resetGame(){
  Object.assign(G, { state: 'idle', taps: 0, streak: 0, combo: 1, base: 0, eventBonus: 0, comboBonus: 0, completion: 0,
    startAt: 0, lastTapAt: -1e9, stageIdx: 0, ev: null, evEnd: 0, nextEventAt: CFG.EVENT_FIRST_DELAY, lastEvent: null, result: null, eventsSeen: [] });
}
const score = () => G.base + G.eventBonus + G.comboBonus + G.completion;
const progress = () => Math.min(1, G.taps / CFG.BASE_TAPS_TO_COMPLETE);
const elapsedMs = () => performance.now() - G.startAt;

// ---- input: one physical tap = one input; held fingers and key auto-repeat never repeat
const pointers = new Set(); const keysDown = new Set();
const gameEl = $('#scr-game');
gameEl.addEventListener('pointerdown', e => {
  if (e.target.closest('[data-nogame]')) return;
  e.preventDefault();
  if (pointers.size >= 2) return;            // ignore 3rd+ simultaneous finger
  pointers.add(e.pointerId);
  registerTap(e.clientX, e.clientY);
}, { passive: false });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => gameEl.addEventListener(t, e => pointers.delete(e.pointerId)));
gameEl.addEventListener('touchstart', e => { if (!e.target.closest('[data-nogame]')) e.preventDefault(); }, { passive: false }); // no double-tap zoom / ghost clicks
document.addEventListener('keydown', e => {
  if (!(e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter')) return;
  if (G.state !== 'playing') return;
  e.preventDefault();
  if (e.repeat || keysDown.has(e.code)) return;
  keysDown.add(e.code); registerTap();
});
document.addEventListener('keyup', e => keysDown.delete(e.code));
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => { if (e.target.closest('#scr-game')) e.preventDefault(); });

function registerTap(x, y){
  if (G.state !== 'playing') return;
  const now = performance.now();
  if (now - G.lastTapAt < CFG.MIN_TAP_INTERVAL) return;
  if (now - G.lastTapAt > CFG.COMBO_TIMEOUT) G.streak = 0;
  G.lastTapAt = now; G.streak++; G.taps++;
  const prevCombo = G.combo;
  G.combo = Math.min(CFG.MAX_COMBO, 1 + Math.floor((G.streak - 1) / CFG.TAPS_PER_COMBO_LEVEL));
  const mult = G.ev === 'fireUp' ? CFG.FIRE_UP_MULTIPLIER : G.ev === 'boost' ? CFG.BOOST_MULTIPLIER : 1;
  const base = CFG.POINTS_PER_TAP, evx = base * (mult - 1), cb = (G.combo - 1) * CFG.COMBO_BONUS_PER_LEVEL;
  G.base += base; G.eventBonus += evx; G.comboBonus += cb;

  // feedback (all cheap, none blocks the next tap)
  FX.tap(); Sfx.sizzle(); if (G.taps % 3 === 0) buzz(4);
  UI.tapFeedback(x, y, base + evx + cb, mult > 1);
  if (G.combo > prevCombo){ UI.comboUp(G.combo); Sfx.combo(); }

  const p = progress(); FX.S.p = p;
  let si = 0; STAGES.forEach(([t], i) => { if (p >= t) si = i; });
  if (si !== G.stageIdx){ G.stageIdx = si; if (si < 4){ UI.stageUp(STAGES[si][1]); Sfx.stage(); FX.burst(0.35); } }
  UI.hud();
  if (G.taps >= CFG.BASE_TAPS_TO_COMPLETE) finish(true);
}

function startCountdown(){
  resetGame(); FX.S.p = 0; FX.S.pDraw = 0; FX.S.heat = 0.25; FX.S.fire = 1;
  Sfx.init(); Sfx.ignite(); FX.layout('game'); warmUp();
  UI.show('count'); G.state = 'countdown';
  const seq = ['3', '2', '1', '🔥 FIRE UP!']; let i = 0;
  const step = () => {
    if (G.state !== 'countdown') return;
    const el = $('#countNum'); el.textContent = seq[i]; el.className = i === 3 ? 'word' : '';
    el.animate([{ transform: 'scale(2.2)', opacity: 0 }, { transform: 'scale(.92)', opacity: 1, offset: .35 }, { transform: 'scale(1)', opacity: 1, offset: .6 }, { transform: 'scale(1.1)', opacity: 0 }], { duration: i === 3 ? 820 : 700, easing: 'ease-out', fill: 'forwards' });
    if (i < 3){ Sfx.beep(); buzz(20); } else { Sfx.go(); FX.burst(0.6); buzz(60); }
    i++;
    if (i < seq.length) setTimeout(step, 700); else setTimeout(beginPlay, 620);
  };
  step();
}
function beginPlay(){
  if (G.state !== 'countdown') return;
  UI.show('game'); UI.hud(); UI.clearEvent();
  G.state = 'playing'; G.startAt = performance.now(); pointers.clear();
  requestAnimationFrame(tick);
}
function tick(){
  if (G.state !== 'playing') return;
  const ms = elapsedMs(), left = Math.max(0, CFG.GAME_DURATION * 1000 - ms);
  UI.time(left);
  if (performance.now() - G.lastTapAt > CFG.COMBO_TIMEOUT && G.combo > 1){ G.combo = 1; G.streak = 0; UI.comboOff(); }
  // heat follows progress; ambient sizzle follows heat
  FX.S.heat = 0.28 + progress() * 0.55; Sfx.ambient(0.02 + progress() * 0.07);
  // events
  if (G.ev && ms >= G.evEnd) endEvent();
  if (G.ev) UI.chipProgress(1 - (G.evEnd - ms) / EVENTS[G.ev].dur());
  if (!G.ev && CFG.EVENTS_ENABLED && ms >= G.nextEventAt && left > CFG.EVENT_QUIET_END && progress() < 0.96) triggerEvent(pickEvent());
  if (left <= 0){ finish(false); return; }
  requestAnimationFrame(tick);
}
function pickEvent(){
  const w = CFG.EVENT_WEIGHTS; const pool = Object.keys(w).filter(k => w[k] > 0 && k !== G.lastEvent);
  const list = pool.length ? pool : Object.keys(w).filter(k => w[k] > 0);
  if (!list.length) return null;
  let r = Math.random() * list.reduce((s, k) => s + w[k], 0);
  for (const k of list){ r -= w[k]; if (r <= 0) return k; } return list[list.length - 1];
}
const gap = () => CFG.EVENT_MIN_GAP + Math.random() * Math.max(0, CFG.EVENT_MAX_GAP - CFG.EVENT_MIN_GAP);
function triggerEvent(key){
  if (!key){ G.nextEventAt = Infinity; return; }
  const ms = elapsedMs(), E = EVENTS[key]; G.lastEvent = key; G.eventsSeen.push(key);
  UI.banner(E.title, E.sub(), E.cls); buzz(40);
  if (key === 'perfect'){
    G.eventBonus += CFG.PERFECT_EVENT_BONUS; Sfx.perfectEvent(); FX.burst(1); FX.S.squash = 1.5;
    UI.floatText('+' + CFG.PERFECT_EVENT_BONUS, true); UI.hud();
    G.nextEventAt = ms + gap(); return;
  }
  G.ev = key; G.evEnd = ms + E.dur();
  document.body.classList.add('ev-' + key.toLowerCase());
  if (key === 'fireUp'){ Sfx.fireBurst(); FX.S.fire = 2.2; FX.burst(0.8); }
  if (key === 'boost'){ Sfx.boost(); FX.S.boost = 1; }
  if (key === 'smoke'){ Sfx.smoke(); FX.S.smokeExtra = 1.2; UI.smoke(true); }
  UI.chip(E.chip(), E.cls);
}
function endEvent(){
  if (!G.ev) return;
  document.body.classList.remove('ev-' + G.ev.toLowerCase());
  if (G.ev === 'smoke'){ UI.smoke(false); FX.S.smokeExtra = 0; }
  FX.S.fire = 1; FX.S.boost = 0;
  G.nextEventAt = G.evEnd + gap(); G.ev = null; UI.clearEvent();
}
function finish(perfect){
  if (G.state !== 'playing') return;
  const ms = Math.min(elapsedMs(), CFG.GAME_DURATION * 1000);
  endEvent(); G.state = 'ending'; pointers.clear(); Sfx.ambient(0);
  if (perfect){
    const secsLeft = Math.floor(Math.max(0, CFG.GAME_DURATION * 1000 - ms) / 1000);
    G.completion = CFG.COMPLETION_BONUS + secsLeft * CFG.TIME_BONUS_PER_SECOND;
    FX.S.p = 1; FX.S.heat = 0.9; FX.burst(1.6); Sfx.win(); buzz([60, 40, 120]);
    UI.banner('🔥 PERFECT GRILL!', "YOU'RE A SPARKORA MASTER", '', true);
  } else {
    UI.time(0); Sfx.timesUp(); buzz(200);
    UI.banner("🔥 TIME'S UP!", Math.round(progress() * 100) + '% GRILLED', 'smoke', true);
  }
  G.result = { perfect, score: score(), time: perfect ? +(ms / 1000).toFixed(2) : null, taps: G.taps, progress: progress(),
    base: G.base, eventBonus: G.eventBonus, comboBonus: G.comboBonus, completion: G.completion, ts: Date.now() };
  G.result.tier = Rewards.tierFor(G.result.score, perfect);
  setTimeout(() => { G.state = 'done'; UI.showResult(G.result); }, perfect ? 1700 : 1400);
}

/* =========================================================================
   8. UI / SCREENS
   ========================================================================= */
const UI = (() => {
  let current = 'loading', popPool = [], popIdx = 0, lastScoreShown = 0, session = { entryId: null, name: null, claimed: null };
  const screens = {}; document.querySelectorAll('.screen').forEach(s => screens[s.id.replace('scr-', '')] = s);
  for (let i = 0; i < 10; i++){ const s = document.createElement('span'); s.className = 'pop'; gameEl.appendChild(s); popPool.push(s); }

  function show(name){
    Object.values(screens).forEach(s => s.classList.remove('on'));
    screens[name].classList.add('on'); current = name;
    FX.layout(name === 'start' ? 'attract' : (name === 'game' || name === 'count') ? 'game' : 'panel');
    FX.pause(name === 'admin');
    if (name === 'game') requestAnimationFrame(() => { const h = $('#progressWrap').getBoundingClientRect(); gameEl.style.setProperty('--hudH', (h.bottom - gameEl.getBoundingClientRect().top) + 'px'); });
    if (screens[name].classList.contains('panel-screen')){ screens[name].classList.add('arming'); setTimeout(() => screens[name].classList.remove('arming'), 750); screens[name].scrollTop = 0; }
  }
  function hud(){
    const p = progress(), s = score();
    $('#bar').style.transform = `scaleX(${p})`;
    $('#pct').textContent = Math.floor(p * 100) + '%';
    $('#stageLabel').textContent = STAGES[G.stageIdx || 0][1];
    if (s !== lastScoreShown){ $('#score').textContent = fmt(s); lastScoreShown = s; }
  }
  function time(msLeft){ const t = (Math.ceil(msLeft / 100) / 10).toFixed(1); const el = $('#time'); if (el.textContent !== t) el.textContent = t;
    $('#hudTime').classList.toggle('low', msLeft <= 5000 && msLeft > 0); }
  function tapFeedback(x, y, pts, hot){
    const b = $('#tapbtn'); b.classList.add('hit'); clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove('hit'), 60);
    const sc = $('#score'); sc.animate([{ transform: 'scale(1.18)' }, { transform: 'scale(1)' }], { duration: 140 });
    if (x == null){ const pt = FX.steakPoint(); x = pt.x; y = pt.y + 40; }
    const r = gameEl.getBoundingClientRect(); const el = popPool[popIdx++ % popPool.length];
    el.textContent = '+' + pts; el.className = 'pop' + (hot ? ' x2' : '');
    const px = x - r.left - 20 + (Math.random() - .5) * 40, py = y - r.top - 50;
    el.animate([{ transform: `translate(${px}px,${py}px) scale(.7)`, opacity: 1 }, { transform: `translate(${px}px,${py - 70}px) scale(1.05)`, opacity: 0 }], { duration: 520, easing: 'ease-out' });
  }
  function floatText(txt){ const pt = FX.steakPoint(); tapFeedback(pt.x, pt.y, txt.replace('+', ''), true); }
  function comboUp(c){ const el = $('#combo'); el.textContent = '🔥 COMBO x' + c; el.classList.add('on');
    el.animate([{ transform: 'translateX(-50%) scale(1.6)' }, { transform: 'translateX(-50%) scale(1)' }], { duration: 260, easing: 'cubic-bezier(.2,1.6,.4,1)' }); }
  function comboOff(){ $('#combo').classList.remove('on'); }
  function stageUp(label){ const el = $('#stageLabel'); el.textContent = label;
    el.animate([{ transform: 'scale(1.35)', color: '#FFE94A' }, { transform: 'scale(1)', color: '#fff' }], { duration: 420, easing: 'ease-out' }); }
  function banner(t, s, cls = '', hold = false){
    const b = $('#banner'); $('#bannerT').textContent = t; $('#bannerS').textContent = s; $('#bannerS').style.display = s ? '' : 'none';
    b.className = 'banner ' + cls; void b.offsetWidth; b.classList.add(hold ? 'hold' : 'show');
  }

$('#btnStart').addEventListener('click', startCountdown);
$('#btnBoardTop').addEventListener('click', () => UI.openBoard('view'));
window.addEventListener('hashchange', route);
function route(){ if (location.hash === '#admin' || /\/admin\/?$/.test(location.pathname)) Admin.open(); else if (location.hash === '#leaderboard') UI.openBoard('view'); }
document.addEventListener('visibilitychange', () => { if (document.hidden) Sfx.ambient(0); });
(async function boot(){
  const t0 = performance.now();
  const imgs = [ASSETS.fire, ASSETS.ice].map(src => { const i = new Image(); i.src = src; return i.decode ? i.decode().catch(() => {}) : Promise.resolve(); });
  const fonts = document.fonts ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  await Promise.all([...imgs, fonts]);
  await new Promise(r => setTimeout(r, Math.max(0, 700 - (performance.now() - t0))));
  FX.resize(); UI.goHome(); route(); Pending.flush();
})();
</script>
