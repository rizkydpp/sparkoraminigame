<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkora Fire Challenge · Live Leaderboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* Big-screen display: designed for a 16:9 TV (1920×1080), scales with the screen height. */
:root{
  --orange:#F26B2C; --ember:#E2461F; --flame:#FFC53D; --flame-2:#FF8A1F; --char:#7A1C0B; --coal:#2B0F07;
  --toast:#FFF3E3; --toast-2:#FFE2BF; --muted:#8A5A45;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Outfit','Segoe UI',system-ui,sans-serif;
  --u:min(1vh,0.5625vw); /* 1 unit = 1% of a 16:9 frame's height */
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --toast:#FFF3E3; } }
:root[data-theme="dark"]{ --toast:#FFF3E3; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;font-family:var(--body);color:var(--coal);background:#C9361A;cursor:default}
body.idle{cursor:none}
#bg{position:fixed;inset:0;background:
  radial-gradient(60% 80% at 22% 58%,#FFB347 0%,rgba(255,138,31,0) 70%),
  linear-gradient(160deg,#FF8A3D 0%,#F0572A 40%,#C9361A 75%,#8E1E0C 100%)}
#embers{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

.frame{position:relative;height:100%;display:grid;grid-template-columns:42% 58%;gap:calc(var(--u)*3);
  padding:calc(var(--u)*4) calc(var(--u)*5)}

/* ---------- left: join ---------- */
.join{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;min-height:0}
.logo{height:calc(var(--u)*9);filter:drop-shadow(0 .4vh 0 rgba(122,28,11,.35))}
.title{font-family:var(--display);line-height:.92;margin-top:calc(var(--u)*1)}
.title .a{display:block;font-size:calc(var(--u)*4.2);color:#fff;text-shadow:0 .5vh 0 var(--char)}
.title .b{display:block;white-space:nowrap;font-size:calc(var(--u)*7.6);background:linear-gradient(180deg,#FFF6C2 0%,var(--flame) 45%,#FF7A1A 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .6vh 0 var(--char)) drop-shadow(0 0 3vh rgba(255,190,60,.6))}
.qrwrap{position:relative;margin:calc(var(--u)*1.5) 0}
.qrcard{background:#fff;border-radius:calc(var(--u)*3.5);padding:calc(var(--u)*2.4);
  box-shadow:0 0 0 calc(var(--u)*.8) var(--flame),0 0 0 calc(var(--u)*1.6) var(--ember),0 2vh 5vh rgba(80,15,5,.45);animation:qrglow 2.4s ease-in-out infinite}
@keyframes qrglow{50%{box-shadow:0 0 0 calc(var(--u)*.8) #FFE58A,0 0 0 calc(var(--u)*1.6) var(--flame-2),0 0 6vh rgba(255,200,70,.9)}}
#qr{display:block;width:calc(var(--u)*34);height:calc(var(--u)*34)}
.mascot{position:absolute;right:calc(var(--u)*-15);bottom:calc(var(--u)*-3);height:calc(var(--u)*25);
  transform-origin:50% 100%;animation:wave 2.6s ease-in-out infinite;filter:drop-shadow(0 1vh 1.2vh rgba(80,15,5,.35))}
@keyframes wave{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-1vh)}}
.scan{font-family:var(--display);font-size:calc(var(--u)*7);color:#fff;line-height:1;text-shadow:0 .5vh 0 var(--char),0 0 3vh rgba(255,210,90,.8)}
.url{margin-top:calc(var(--u)*.6);font-weight:800;font-size:calc(var(--u)*2.3);color:var(--toast)}
.tiers{display:flex;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1.5)}
.tier{background:rgba(43,15,7,.28);border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1) calc(var(--u)*1.6);color:#fff;text-align:center;min-width:calc(var(--u)*17)}
.tier b{display:block;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*2.3);color:var(--flame)}
.tier span{display:block;font-weight:800;font-size:calc(var(--u)*1.8)}
.tier small{display:block;font-size:calc(var(--u)*1.5);opacity:.85}

/* ---------- right: leaderboard ---------- */
.board{background:var(--toast);border-radius:calc(var(--u)*4);box-shadow:0 2.4vh 6vh rgba(70,15,4,.4);display:flex;flex-direction:column;
  padding:calc(var(--u)*3) calc(var(--u)*3.4);min-height:0}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*2);margin-bottom:calc(var(--u)*1.6)}
.bhead h1{margin:0;white-space:nowrap;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*5.2);color:var(--ember);line-height:1}
.bhead .sub{font-weight:800;font-size:calc(var(--u)*2);color:var(--muted)}
.live{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--u)*.6)}
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*.8);font-weight:800;font-size:calc(var(--u)*1.9);letter-spacing:.08em;
  color:#fff;background:var(--ember);border-radius:99px;padding:calc(var(--u)*.6) calc(var(--u)*1.6)}
.pill::before{content:"";width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);border-radius:50%;background:#fff;animation:blink 1.2s steps(2) infinite}
.pill.off{background:#8A5A45}.pill.off::before{animation:none;opacity:.5}
@keyframes blink{50%{opacity:.2}}
.count{font-weight:800;font-size:calc(var(--u)*2.1);color:var(--coal)}
.rows{flex:1;display:flex;flex-direction:column;gap:calc(var(--u)*.9);min-height:0}
.hdr,.row{display:grid;grid-template-columns:calc(var(--u)*9) 1fr calc(var(--u)*17) calc(var(--u)*13);align-items:center;column-gap:calc(var(--u)*1.5)}
.hdr{font-weight:800;font-size:calc(var(--u)*1.6);letter-spacing:.1em;color:var(--muted);padding:0 calc(var(--u)*2)}
.hdr span:nth-child(3),.hdr span:nth-child(4),.row .sc,.row .tm{text-align:right}
.row{flex:1;max-height:calc(var(--u)*6.6);background:#fff;border-radius:calc(var(--u)*1.8);padding:0 calc(var(--u)*2);
  font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.row .rk{font-family:var(--display);font-size:calc(var(--u)*3.6);color:var(--coal);text-align:center}
.row .nm{font-family:var(--display);font-size:calc(var(--u)*3.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sc{font-family:var(--display);font-size:calc(var(--u)*3.8);color:var(--ember)}
.row .tm{font-weight:800;font-size:calc(var(--u)*2.6);color:var(--muted)}
.row.r1{background:linear-gradient(90deg,#FFD24A,#FFE58A);max-height:calc(var(--u)*8)}
.row.r1 .rk,.row.r1 .nm,.row.r1 .sc{font-size:calc(var(--u)*4.4)}
.row.r2{background:#FFF0C8}.row.r3{background:#FFE7D2}
.row.new{animation:newrow 1.2s ease-in-out 5}
@keyframes newrow{50%{box-shadow:inset 0 0 0 calc(var(--u)*.5) var(--ember),0 0 3vh rgba(255,140,40,.9);transform:scale(1.015)}}
.row.empty{background:transparent;border:calc(var(--u)*.3) dashed var(--toast-2)}
.row.empty .nm{color:#D9BFA8;font-family:var(--body);font-weight:600;font-size:calc(var(--u)*2.4)}
.row.empty .rk{color:#D9BFA8}
.emptybig{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--u)*1.5)}
.emptybig b{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*5);color:var(--ember)}
.emptybig span{font-weight:600;font-size:calc(var(--u)*2.6);color:var(--muted)}
.ticker{margin-top:calc(var(--u)*1.6);font-weight:800;font-size:calc(var(--u)*2.1);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.3em}
.ticker b{color:var(--coal)}

/* ---------- new-score celebration ---------- */
#celebrate{position:fixed;left:50%;top:calc(var(--u)*4);transform:translate(-50%,-160%);z-index:10;display:flex;align-items:center;gap:calc(var(--u)*2);
  background:var(--coal);color:#fff;border-radius:calc(var(--u)*3);padding:calc(var(--u)*1.6) calc(var(--u)*3.4);
  box-shadow:0 0 0 calc(var(--u)*.6) var(--flame),0 0 6vh rgba(255,180,50,.9);opacity:0;visibility:hidden;transition:transform .6s cubic-bezier(.2,1.4,.4,1),opacity .3s,visibility 0s .6s}
#celebrate.on{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .6s cubic-bezier(.2,1.4,.4,1),opacity .2s}
#celebrate .t{font-family:var(--display);font-size:calc(var(--u)*4.4);white-space:nowrap}
#celebrate .t em{font-style:normal;color:var(--flame)}
#celebrate .k{font-weight:800;font-size:calc(var(--u)*2.2);color:var(--toast-2);white-space:nowrap}
.demo{position:fixed;right:calc(var(--u)*2);bottom:calc(var(--u)*1);background:rgba(43,15,7,.7);color:#fff;font-weight:800;
  font-size:calc(var(--u)*1.7);padding:calc(var(--u)*.6) calc(var(--u)*1.6);border-radius:99px;display:none}
.demo.on{display:block}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--u)*.6);color:rgba(255,243,227,.75);font-weight:600;font-size:calc(var(--u)*1.6);transition:opacity .4s}
body.idle .hint,body.fs .hint{opacity:0}

@media (orientation:portrait){
  :root{--u:min(0.56vh,1vw)}
  .frame{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:calc(var(--u)*5)}
  .mascot{right:calc(var(--u)*-18)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script src="config.js"></script>
<script>
'use strict';
const CONF = window.SPARKORA_CONFIG || {};
const POLL_MS = 8000, TOP_N = 10;   // Google Sheets: refresh every 8 s
const OUTLET = (new URLSearchParams(location.search).get('outlet') || '').slice(0, 40) || null;
const REWARDS = (CONF.rewards && CONF.rewards.length ? CONF.rewards : [
  { minScore: 2400, title: 'SPARKORA FAN', reward: 'FREE TOYS' },
  { minScore: 3200, title: 'GRILL MASTER', reward: 'FREE DRINK' },
  { minScore: 3700, title: 'SPARKORA LEGEND', reward: 'SPECIAL MERCHANDISE' }]).slice().sort((a, b) => a.minScore - b.minScore);
const SHEET_API = (() => { const u = (CONF.SHEET_API_URL || '').trim(); return /^https:\/\/script\.google(usercontent)?\.com\//.test(u) || /^https?:\/\/localhost/.test(u) ? u : null; })();
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- QR (always matches where the game lives) ---------- */
function gameUrl(){
  let u = (CONF.GAME_URL || '').trim();
  if (!u && !window.SPARKORA_CONFIG) u = 'https://sparkoraminigame.vercel.app/'; // preview without config.js
  if (!u){ u = location.origin + location.pathname.replace(/\/(display|tv)(\.html)?\/?$/, '/').replace(/[^/]*$/, ''); }
  if (!/^https?:/.test(u)) u = 'https://sparkoraminigame.vercel.app/';
  if (OUTLET) u += (u.includes('?') ? '&' : '?') + 'outlet=' + encodeURIComponent(OUTLET);
  return u;
}
function drawQR(){
  const url = gameUrl(), q = qrcode(0, 'H'); q.addData(url); q.make();
  const n = q.getModuleCount(), pad = 0; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  const hole = Math.round(n * 0.2) | 1, h0 = (n - hole) / 2;
  $('#qr').setAttribute('viewBox', `0 0 ${n} ${n}`);
  $('#qr').innerHTML = `<path d="${d}" fill="#2B0F07" shape-rendering="crispEdges"/>
    <rect x="${h0}" y="${h0}" width="${hole}" height="${hole}" rx="${hole / 5}" fill="#fff"/>
    <image href="${FIRE_SRC}" x="${h0 + hole * 0.08}" y="${h0 + hole * 0.06}" width="${hole * 0.84}" height="${hole * 0.88}" preserveAspectRatio="xMidYMid meet"/>`;
  $('#url').textContent = url.replace(/^https?:\/\//, '').replace(/\/$/, '').replace(/\/\?/, '?');
}
const FIRE_SRC = document.querySelector('.mascot').src;

/* ---------- data source ---------- */
async function fetchBoard(){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 15000);
  const p = new URLSearchParams({ action: 'board', scope: 'today', limit: TOP_N }); if (OUTLET) p.set('outlet', OUTLET);
  try {
    const r = await fetch(SHEET_API + '?' + p, { redirect: 'follow', cache: 'no-store', signal: ctl.signal });
    const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Sheet API error');
    return { top: j.top, total: j.total, latest: j.latest };
  } finally { clearTimeout(t); }
}
// Demo mode (no keys yet): fake live activity so the layout can be checked on the TV.
const demo = { list: [['KEVIN', 3980, 16.2], ['SARAH', 3710, 17.9], ['JASON', 3455, 19.4], ['MEI', 3120, 21.0], ['BUDI', 2890, 23.7], ['RINA', 2640, 25.1]]
  .map(([name, score, time], i) => ({ id: 'd' + i, name, score, time, created_at: new Date(Date.now() - (6 - i) * 6e5).toISOString() })) };
async function fetchDemo(){
  if (Math.random() < 0.18){ const names = ['ELVI', 'ANDRE', 'SISKA', 'TONO', 'LALA', 'DIMAS', 'NADIA', 'YOGA'];
    demo.list.push({ id: 'd' + Date.now(), name: names[Math.floor(Math.random() * names.length)], score: 2400 + Math.floor(Math.random() * 1700), time: +(15 + Math.random() * 13).toFixed(2), created_at: new Date().toISOString() }); }
  const sorted = demo.list.slice().sort((a, b) => b.score - a.score || a.time - b.time);
  const latest = demo.list.slice().sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
  return { top: sorted.slice(0, TOP_N), total: demo.list.length, latest };
}

/* ---------- render ---------- */
let lastLatestId = null, firstLoad = true, highlightId = null, highlightUntil = 0, failures = 0;
function render({ top, total, latest }){
  if (latest && latest.id !== lastLatestId){
    if (!firstLoad){ const rank = top.findIndex(e => e.id === latest.id); highlightId = latest.id; highlightUntil = Date.now() + 8000; celebrate(latest, rank); }
    lastLatestId = latest.id;
  }
  firstLoad = false;
  const rows = $('#rows');
  if (!top.length){
    rows.innerHTML = `<div class="emptybig"><b>No champions yet today</b><span>Scan the QR code and be the first name on this screen!</span></div>`;
  } else {
    const cells = [];
    for (let i = 0; i < TOP_N; i++){
      const e = top[i];
      if (!e){ cells.push(`<div class="row empty"><span class="rk">${i + 1}</span><span class="nm">Your name here?</span><span></span><span></span></div>`); continue; }
      const isNew = e.id === highlightId && Date.now() < highlightUntil;
      cells.push(`<div class="row ${i < 3 ? 'r' + (i + 1) : ''} ${isNew ? 'new' : ''}"><span class="rk">${i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</span>
        <span class="nm">${esc(e.name)}</span><span class="sc">${fmt(e.score)}</span><span class="tm">${e.time != null ? (+e.time).toFixed(2) + 's' : '—'}</span></div>`);
    }
    rows.innerHTML = cells.join('');
  }
  $('#count').textContent = total ? `${fmt(total)} champion${total === 1 ? '' : 's'} today` : '';
  $('#ticker').innerHTML = latest ? `Latest: <b>${esc(latest.name)}</b> grilled a perfect Sparkora for <b>${fmt(latest.score)}</b> points ${ago(latest.created_at)}` : 'Tap fast. Grill perfectly. Win rewards!';

}
function ago(iso){ const s = Math.max(0, (Date.now() - new Date(iso)) / 1000); if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; return Math.floor(s / 3600) + ' h ago'; }
let celT = null;
function celebrate(e, rank){
  $('#celT').innerHTML = `🔥 ${esc(e.name)} scored <em>${fmt(e.score)}</em>`;
  $('#celK').textContent = rank >= 0 ? (rank === 0 ? 'NEW #1 TODAY! 👑' : `#${rank + 1} TODAY`) : 'NEW PERFECT GRILL!';
  $('#celebrate').classList.add('on'); Embers.burst(rank === 0 ? 3 : 1.5);
  clearTimeout(celT); celT = setTimeout(() => $('#celebrate').classList.remove('on'), 6000);
}

async function poll(){
  try {
    const data = SHEET_API ? await fetchBoard() : await fetchDemo();
    render(data);
    failures = 0; $('#livePill').classList.remove('off'); $('#livePill').textContent = 'LIVE';
  } catch (err){
    failures++; if (failures >= 2){ $('#livePill').classList.add('off'); $('#livePill').textContent = 'RECONNECTING'; }
  }
  setTimeout(poll, failures ? Math.min(30000, POLL_MS * (failures + 1)) : POLL_MS);
}

/* ---------- embers background (light) ---------- */
const Embers = (() => {
  const cv = $('#embers'), ctx = cv.getContext('2d'); let W, H, dpr; const ps = [];
  const spr = document.createElement('canvas'); spr.width = spr.height = 32; const g = spr.getContext('2d');
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,250,210,1)'); gr.addColorStop(.35, 'rgba(255,200,80,.85)'); gr.addColorStop(1, 'rgba(255,110,20,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  function size(){ dpr = Math.min(1.5, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; }
  size(); addEventListener('resize', size);
  function add(x, y, v){ if (ps.length > 220) return; ps.push({ x, y, vx: (Math.random() - .5) * 30 * v, vy: -(30 + Math.random() * 80) * v, l: 0, m: 3 + Math.random() * 4, s: 4 + Math.random() * 10 }); }
  let last = performance.now();
  (function f(now){ const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (Math.random() < 0.9) add(Math.random() * W, H + 10, 1);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
    for (let i = ps.length - 1; i >= 0; i--){ const p = ps[i]; p.l += dt; if (p.l > p.m){ ps.splice(i, 1); continue; }
      p.x += (p.vx + Math.sin(now / 700 + i) * 12) * dt; p.y += p.vy * dt; ctx.globalAlpha = Math.sin(p.l / p.m * Math.PI) * .8; ctx.drawImage(spr, p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
    requestAnimationFrame(f); })(last);
  return { burst(k){ for (let i = 0; i < 90 * k; i++) add(W * (0.3 + Math.random() * 0.4), H * 0.2 + Math.random() * H * 0.2, 2.5); } };
})();

/* ---------- screen helpers: full screen, keep awake, hide cursor, daily refresh ---------- */
let wake = null;
async function keepAwake(){ try { if ('wakeLock' in navigator) wake = await navigator.wakeLock.request('screen'); } catch (e) {} }
document.addEventListener('click', () => { const el = document.documentElement; if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); keepAwake(); });
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('fs', !!document.fullscreenElement));
document.addEventListener('visibilitychange', () => { if (!document.hidden){ keepAwake(); } });
let idleT; document.addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 3000); });
setTimeout(() => document.body.classList.add('idle'), 4000);
function stampDate(){ $('#date').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }) + (OUTLET ? ' · ' + OUTLET.toUpperCase() : ''); }
setInterval(stampDate, 60000);
setTimeout(() => location.reload(), 6 * 3600 * 1000); // fresh page every 6 h for long-running TVs

$('#tiers').innerHTML = REWARDS.map((r, i) => `<div class="tier"><b>${'🔥'.repeat(Math.min(3, i + 1))} ${fmt(r.minScore)}+</b><span>${esc(r.reward)}</span><small>${esc(r.title)}</small></div>`).join('');
$('#demo').classList.toggle('on', !SHEET_API);
stampDate(); drawQR(); poll();
</script>
